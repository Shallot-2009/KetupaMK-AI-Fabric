name: Product problem / 产品问题
description: Report a reproducible installation or product issue / 提交可复现的安装或产品问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use sanitized information only. Do not upload private LIC files, keys, device fingerprints, or customer projects. / 仅提交脱敏信息，不上传私有 LIC、密钥、设备指纹或客户工程。"
  - type: input
    id: version
    attributes:
      label: Product version and installer / 产品版本与安装包
      description: Include the exact package filename and SHA-256 result / 填写准确文件名与 SHA-256 核对结果
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture / 操作系统与架构
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal steps and expected behavior / 最小复现步骤与预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error / 实际结果与脱敏错误
    validations:
      required: true
